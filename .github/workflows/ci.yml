
name: RecipeBox CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Mengambil Kode Repository
        uses: actions/checkout@v4

      - name: Menyiapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Menginstal Dependency Laravel
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Menyiapkan Environment Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Menjalankan Pengujian Laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Mengambil Kode Repository
        uses: actions/checkout@v4

      - name: Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Menginstal Dependency Vue
        run: npm ci

      - name: Melakukan Build Frontend
        run: npm run build

  deploy:
    name: Deploy GHCR
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Mengambil Kode Repository
        uses: actions/checkout@v4

      - name: Persiapan Deploy
        run: echo "Deploy hanya berjalan ketika terdapat push ke branch main"
